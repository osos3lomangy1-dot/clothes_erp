name: Windows Build & Release

permissions:
  contents: write

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      build_msix:
        description: 'Also build MSIX installer? (true/false)'
        required: false
        default: 'true'
      build_safe_mode:
        description: 'Build Safe Mode (ENABLE_FIREBASE=false)? (true/false)'
        required: false
        default: 'true'

jobs:
  analyze-and-test:
    name: 🔍 Analyze & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      - name: Run Code Generation
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Flutter Analyze
        run: flutter analyze --no-fatal-warnings --no-fatal-infos
        continue-on-error: true

      - name: Flutter Test
        run: flutter test --reporter github

  build-windows:
    name: 🪟 Build Windows
    runs-on: windows-2022
    needs: analyze-and-test

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ─────────────────────────────────────────────────────────────────────────
      # FIX: GitHub Actions windows-latest ships CMake 4.x which removed
      # backward-compatibility with cmake_minimum_required < 3.5.
      # The Firebase C++ SDK for Windows uses that old directive and breaks.
      # Solution: install CMake 3.31 via Chocolatey BEFORE Flutter setup,
      # then prepend it to PATH so the Flutter tool picks it up.
      # ─────────────────────────────────────────────────────────────────────────
      - name: Pin CMake 3.31 via Chocolatey (fix Firebase SDK + CMake 4.x)
        shell: pwsh
        run: |
          Write-Host "Current cmake version:"
          cmake --version

          Write-Host "`nInstalling CMake 3.31.7 via choco..."
          choco install cmake --version=3.31.7 `
            --installargs '"ADD_CMAKE_TO_PATH=System"' `
            -y --no-progress --force

          # Prepend cmake 3.31 to PATH for ALL subsequent steps
          $cmake31Path = "C:\Program Files\CMake\bin"
          Add-Content -Path $env:GITHUB_PATH -Value $cmake31Path

          # Update PATH in current session too
          $env:PATH = "$cmake31Path;$env:PATH"

          Write-Host "`nCMake version after install (should be 3.31.x):"
          cmake --version

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      # ─────────────────────────────────────────────────────────────────────────
      # SAFETY NET: Patch firebase_core Windows plugin CMakeLists.txt in
      # the pub cache to pass -DCMAKE_POLICY_VERSION_MINIMUM=3.5 to the
      # ExternalProject_Add for firebase_cpp_sdk_windows.
      # This covers the case where cmake 3.31 isn't picked up by flutter.
      # ─────────────────────────────────────────────────────────────────────────
      - name: Patch Firebase CMake (belt-and-suspenders fix)
        shell: pwsh
        run: |
          $pubCache = $env:PUB_CACHE
          if (-not $pubCache) { $pubCache = "$env:LOCALAPPDATA\Pub\Cache" }
          Write-Host "Pub cache path: $pubCache"

          # Find all CMakeLists.txt inside firebase_core (windows plugin)
          $files = Get-ChildItem -Path $pubCache -Recurse -Filter "CMakeLists.txt" `
            -ErrorAction SilentlyContinue |
            Where-Object {
              $_.FullName -match "firebase_core" -and
              $_.FullName -match "windows" -and
              $_.FullName -notmatch "firebase_cpp_sdk"
            }

          if (-not $files) {
            Write-Host "No firebase_core windows CMakeLists.txt found — skipping patch."
            exit 0
          }

          foreach ($f in $files) {
            Write-Host "Inspecting: $($f.FullName)"
            $raw = Get-Content -Path $f.FullName -Raw

            # Only patch if ExternalProject_Add exists and not already patched
            if ($raw -match 'ExternalProject_Add' -and
                $raw -notmatch 'CMAKE_POLICY_VERSION_MINIMUM') {

              # Add CMAKE_ARGS before the first closing paren of ExternalProject_Add
              $patched = $raw -replace `
                '(ExternalProject_Add\s*\(\s*firebase_cpp_sdk_windows\b)', `
                "`$1`n    CMAKE_ARGS -DCMAKE_POLICY_VERSION_MINIMUM=3.5"

              Set-Content -Path $f.FullName -Value $patched -NoNewline
              Write-Host "  ✅ Patched!"
            } else {
              Write-Host "  ⏭  No ExternalProject_Add found or already patched — skipped."
            }
          }

      - name: Run Code Generation
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: Verify CMake Version (must be 3.31.x)
        shell: pwsh
        run: |
          $v = cmake --version
          Write-Host $v
          if ($v -notmatch "3\.31") {
            Write-Warning "cmake is NOT 3.31.x — build may fail with Firebase SDK!"
          }

      - name: Build Windows Release
        run: flutter build windows --release --dart-define=GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }}

      - name: Get App Version
        id: version
        shell: pwsh
        run: |
          $match = Select-String -Path pubspec.yaml -Pattern "^version:\s+(.+?)(\+|$)"
          $version = $match.Matches.Groups[1].Value.Trim()
          if (-not $version) { $version = "1.0.0" }
          "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "App version: $version"

      - name: Package Release (ZIP)
        shell: pwsh
        run: |
          $src = "build\windows\x64\runner\Release"
          if (Test-Path "windows\installer\launch_app.bat") {
            Copy-Item -Path "windows\installer\launch_app.bat" -Destination "$src\launch_app.bat" -Force
          }
          $zip = "Orkeed_erp_windows_v${{ env.APP_VERSION }}.zip"
          Compress-Archive -Path "$src\*" -DestinationPath $zip -Force
          Write-Host "ZIP created: $zip"

      - name: Upload Windows Release ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Orkeed-erp-windows-v${{ env.APP_VERSION }}
          path: Orkeed_erp_windows_v${{ env.APP_VERSION }}.zip
          retention-days: 30
          if-no-files-found: error

      - name: Build Inno Setup Installer (with bundled VC++ Redist)
        shell: pwsh
        run: |
          # Download official vc_redist.x64.exe to bundle inside the installer for 100% offline installs
          Write-Host "Downloading vc_redist.x64.exe..."
          Invoke-WebRequest -Uri "https://aka.ms/vs/17/release/vc_redist.x64.exe" -OutFile "windows\installer\vc_redist.x64.exe"
          
          # Compile Inno Setup Script
          $isccPath = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $isccPath)) {
            Write-Host "Installing Inno Setup via choco..."
            choco install innosetup -y --no-progress
          }
          & "$isccPath" "windows\installer\inno_setup.iss"
        continue-on-error: true

      - name: Upload Inno Setup Installer
        uses: actions/upload-artifact@v4
        with:
          name: Orkeed-erp-setup-v${{ env.APP_VERSION }}
          path: build/installer/*.exe
          retention-days: 30
          if-no-files-found: warn

      - name: Build MSIX Installer
        if: ${{ github.event.inputs.build_msix != 'false' }}
        run: dart run msix:create
        continue-on-error: true

      - name: Upload MSIX Installer
        if: ${{ github.event.inputs.build_msix != 'false' }}
        uses: actions/upload-artifact@v4
        with:
          name: Orkeed-erp-msix-v${{ env.APP_VERSION }}
          path: build/windows/x64/runner/Release/*.msix
          retention-days: 30
          if-no-files-found: warn

      # ─────────────────────────────────────────────────────────────────────────
      # SAFE MODE BUILD (ENABLE_FIREBASE=false)
      # Completely bypasses Firebase initialization and SDK runtime calls.
      # Used to diagnose native MSVCP140.dll / 0xc0000005 crashes.
      # ─────────────────────────────────────────────────────────────────────────
      - name: Build Windows Safe Mode Release
        if: ${{ github.event.inputs.build_safe_mode != 'false' }}
        run: flutter build windows --release --dart-define=ENABLE_FIREBASE=false --dart-define=GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }}

      - name: Package Safe Mode Release (ZIP)
        if: ${{ github.event.inputs.build_safe_mode != 'false' }}
        shell: pwsh
        run: |
          $src = "build\windows\x64\runner\Release"
          if (Test-Path "windows\installer\launch_app.bat") {
            Copy-Item -Path "windows\installer\launch_app.bat" -Destination "$src\launch_app.bat" -Force
          }
          $zip = "orchid-erp-windows-safe-mode.zip"
          Compress-Archive -Path "$src\*" -DestinationPath $zip -Force
          Write-Host "Safe Mode ZIP created: $zip"

      - name: Upload Safe Mode Release ZIP
        if: ${{ github.event.inputs.build_safe_mode != 'false' }}
        uses: actions/upload-artifact@v4
        with:
          name: orchid-erp-windows-safe-mode
          path: orchid-erp-windows-safe-mode.zip
          retention-days: 30
          if-no-files-found: error

      # ─────────────────────────────────────────────────────────────────────────
      # AUTOMATIC GITHUB RELEASE CREATION
      # Publishes an official GitHub Release with installer & zip assets
      # whenever changes are pushed to main.
      # ─────────────────────────────────────────────────────────────────────────
      - name: Create or Update GitHub Release
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          name: "Release v${{ env.APP_VERSION }}"
          body: |
            ## تحديث نظام أوركيد ERP v${{ env.APP_VERSION }}
            - تم بناء النسخة ورفع ملفات التثبيت بنجاح.
          files: |
            Orkeed_erp_windows_v${{ env.APP_VERSION }}.zip
            build/installer/*.exe
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
