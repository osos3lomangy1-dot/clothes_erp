name: Windows Build & Release

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      build_msix:
        description: 'Also build MSIX installer? (true/false)'
        required: false
        default: 'true'

jobs:
  analyze-and-test:
    name: 🔍 Analyze & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      - name: Run Code Generation
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Flutter Analyze
        run: flutter analyze

      - name: Flutter Test
        run: flutter test --reporter github

  build-windows:
    name: 🪟 Build Windows
    runs-on: windows-2022
    needs: analyze-and-test

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ─────────────────────────────────────────────────────────────────────────
      # FIX: GitHub Actions windows runner ships CMake 4.x which removed
      # backward-compatibility with cmake_minimum_required < 3.5.
      # Solution: Install CMake 3.31 and replace Visual Studio's internal CMake.
      # ─────────────────────────────────────────────────────────────────────────
      - name: Pin CMake 3.31 via Chocolatey & Override Visual Studio CMake
        shell: pwsh
        run: |
          Write-Host "Installing CMake 3.31.7 via choco..."
          choco install cmake --version=3.31.7 --installargs '"ADD_CMAKE_TO_PATH=System"' -y --no-progress --force

          $cmake31Path = "C:\Program Files\CMake\bin"
          Add-Content -Path $env:GITHUB_PATH -Value $cmake31Path
          $env:PATH = "$cmake31Path;$env:PATH"

          # Override Visual Studio's internal CMake so Flutter tool always runs CMake 3.31
          $vsCmakeDirs = Get-ChildItem "C:\Program Files\Microsoft Visual Studio" -Recurse -Filter "cmake.exe" -ErrorAction SilentlyContinue | Select-Object -ExpandProperty DirectoryName -Unique
          foreach ($dir in $vsCmakeDirs) {
            Write-Host "Overwriting VS CMake at: $dir"
            Copy-Item "$cmake31Path\*" -Destination $dir -Force -Recurse -ErrorAction SilentlyContinue
          }

          Write-Host "`nCMake version:"
          cmake --version

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      - name: Run Code Generation
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      # ─────────────────────────────────────────────────────────────────────────
      # PRE-EXTRACT & PATCH Firebase C++ SDK
      # Ensures CMakeLists.txt inside firebase_cpp_sdk has cmake_minimum_required(VERSION 3.5)
      # ─────────────────────────────────────────────────────────────────────────
      - name: Pre-download and patch Firebase C++ SDK
        shell: pwsh
        run: |
          $extractedBase = "build\windows\x64\extracted"
          $fbSdkDir = "$extractedBase\firebase_cpp_sdk_windows"
          $zipPath = "build\windows\x64\firebase_cpp_sdk_windows_12.7.0.zip"
          
          New-Item -ItemType Directory -Force -Path $extractedBase | Out-Null

          if (-not (Test-Path $zipPath)) {
            Write-Host "Downloading Firebase C++ SDK 12.7.0..."
            Invoke-WebRequest -Uri "https://dl.google.com/firebase/sdk/cpp/firebase_cpp_sdk_windows_12.7.0.zip" -OutFile $zipPath
          }

          if (-not (Test-Path $fbSdkDir)) {
            Write-Host "Extracting Firebase C++ SDK..."
            Expand-Archive -Path $zipPath -DestinationPath $extractedBase -Force
          }

          $cmFile = "$fbSdkDir\CMakeLists.txt"
          if (Test-Path $cmFile) {
            Write-Host "Patching $cmFile to VERSION 3.5..."
            (Get-Content $cmFile) -replace 'cmake_minimum_required\s*\(\s*VERSION\s+[0-9.]+\s*\)', 'cmake_minimum_required(VERSION 3.5)' | Set-Content $cmFile
            Write-Host "Firebase SDK CMakeLists.txt patched successfully!"
          }

      - name: Build Windows Release
        run: flutter build windows --release

      - name: Get App Version
        id: version
        shell: pwsh
        run: |
          $match = Select-String -Path pubspec.yaml -Pattern "^version:\s+(.+?)(\+|$)"
          $version = $match.Matches.Groups[1].Value.Trim()
          if (-not $version) { $version = "1.0.0" }
          "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "App version: $version"

      - name: Package Release (ZIP)
        shell: pwsh
        run: |
          $src = "build\windows\x64\runner\Release"
          $zip = "orchid_erp_windows_v${{ env.APP_VERSION }}.zip"
          Compress-Archive -Path "$src\*" -DestinationPath $zip -Force
          Write-Host "ZIP created: $zip"

      - name: Upload Windows Release ZIP
        uses: actions/upload-artifact@v4
        with:
          name: orchid-erp-windows-v${{ env.APP_VERSION }}
          path: orchid_erp_windows_v${{ env.APP_VERSION }}.zip
          retention-days: 30
          if-no-files-found: error

      - name: Build MSIX Installer
        if: ${{ github.event.inputs.build_msix != 'false' }}
        run: dart run msix:create
        continue-on-error: true

      - name: Upload MSIX Installer
        if: ${{ github.event.inputs.build_msix != 'false' }}
        uses: actions/upload-artifact@v4
        with:
          name: orchid-erp-msix-v${{ env.APP_VERSION }}
          path: build/windows/x64/runner/Release/*.msix
          retention-days: 30
          if-no-files-found: warn
