name: clothes_erp
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.2+3

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_secure_storage: ^9.2.4
  get_it: ^8.0.3
  injectable: ^2.5.0
  dartz: ^0.10.1
  flutter_bloc: ^8.1.6
  bloc: ^8.1.4
  equatable: ^2.0.7
  excel: ^4.0.6
  file_picker: ^8.1.2
  drift: ^2.20.0
  drift_flutter: ^0.2.0
  sqlite3: ^2.4.0
  path_provider: ^2.1.4
  uuid: ^4.4.0
  intl: ^0.19.0
  google_fonts: ^8.2.1
  package_info_plus: ^9.0.1
  url_launcher: ^6.3.3
  http: ^1.2.2
  dio: ^5.7.0
  fl_chart: ^1.3.1
  pdf: ^3.12.0
  printing: ^5.14.3
  crypto: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.15
  injectable_generator: ^2.6.2
  drift_dev: ^2.20.0
  msix: ^3.16.12

flutter:
  uses-material-design: true

  assets:
    - assets/icons/

  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/static/Cairo-Regular.ttf
          weight: 400
        - asset: assets/fonts/static/Cairo-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/static/Cairo-Bold.ttf
          weight: 700
        - asset: assets/fonts/static/Cairo-Black.ttf
          weight: 900

msix_config:
  display_name: Bay3ah - بيعة
  publisher_display_name: Bay3ah
  identity_name: com.bay3ah.erp
  msix_version: 1.0.2.0
  logo_path: windows/runner/resources/app_icon.ico
  capabilities: internetClient

